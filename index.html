<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top 20 Spotify Artists</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #0a0a0a, #000);
    }
    .glass {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 20px;
    }
    .rank {
      background: linear-gradient(135deg, #1db954, #1ed760);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="text-white font-sans">

  <!-- Header -->
  <header class="text-center py-10">
    <h1 class="text-5xl font-extrabold tracking-wide rank">🔥 Top 20 Spotify Artists</h1>

  </header>

    <div class="glass p-6 shadow-2xl transition-all duration-500 hover:scale-[1.02] hover:shadow-green-600/20">

        <div class="flex-1 w-full">

            src="https://open.spotify.com/embed/artist/0PYoQyfkI47SQecvr8Z4Gz?utm_source=generator"
